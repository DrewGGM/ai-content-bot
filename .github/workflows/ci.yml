name: CI

# Corre en cada push y PR: typecheck + tests + validación del JS del panel. Sin secretos.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: JS del panel (sintaxis)
        run: npx tsx scripts/check-client-js.mjs
